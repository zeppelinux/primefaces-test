<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">

    <h:head>java -version
        <title>PrimeFaces Test</title>
        <h:outputScript name="test.js" />
        <h:outputStylesheet name="test.css" />
        <h:outputStylesheet name="primeflex.min.css"/>
    </h:head>
    <h:body>

        <h1>#{testView.string}</h1>
        <h:form id="mainForm">
            <p:card id="galleryContent" style="min-height: 400px">
                <p:galleria value="#{testView.images}" var="_img" responsiveOptions="#{testView.responsiveOptions}"
                            styleClass="w-full" id="gallery" showCaption="true" showItemNavigatorsOnHover="true" circular="true" autoPlay="true">
                    <picture>
                        <!-- Use large image for screens 960px and wider -->
                        <source media="(min-width: 800px)" srcset="#{_img.largeImageUrl}"/>
                        <!-- Fallback/Default to small image for mobile/medium -->
                        <img src="#{_img.smallImageUrl}" alt="Gallery Image" class="w-full h-auto" />
                    </picture>
                    <f:facet name="caption">
                        <h4>#{_img.description}</h4>
                    </f:facet>
                    <f:facet name="thumbnail">
                        <div class="relative inline-block m-1">
                            <p:graphicImage url="#{_img.smallImageUrl}" width="50" height="50" cache="true"/>
                            <button type="button"
                                    title="Delete Image"
                                    onclick="executeDelete('#{_img.id}');"
                                    class="absolute bottom-0 right-1 ui-button-danger ui-button-flat p-0 ui-button ui-widget ui-state-default ui-corner-all w-5 h-5"
                                    style="z-index: 100; cursor: pointer; border: none; background: transparent; color: #ef4444;">
                                <span class="pi pi-trash" style="font-size: 1rem;"></span>
                            </button>
                        </div>
                    </f:facet>
                </p:galleria>
            </p:card>

            <p:remoteCommand name="deleteBridge"
                             actionListener="#{testView.deleteGalleryImageById}"
                             update="galleryContent"
                             process="@this" />
            <script type="text/javascript">
                function executeDelete(photoId) {
                    if(confirm('Are you sure you want to delete this image?')) {
                        // Passes the raw primitive ID cleanly into the Request Parameters Map
                        deleteBridge([{name: 'imageId', value: photoId}]);
                    }
                }
            </script>

        </h:form>
    </h:body>
</html>
